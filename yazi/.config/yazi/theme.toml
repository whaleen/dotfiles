# Whaleen theme for Yazi (generated — do not edit by hand)
# Requires yazi 26.x+

[mgr]
cwd = { fg = "#B86A2A" }

icon_folder  = { fg = "#1A1A2E" }
icon_file    = { fg = "#4A4A62" }
icon_command = { fg = "#7A5010" }

hovered        = { fg = "#F8F6FF", bg = "#C8C4DF" }
symlink_target = { fg = "#696980", italic = true }

find_keyword  = { fg = "#B86A2A", bold = true, italic = true, underline = true }
find_position = { fg = "#802870", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#147848", bg = "#147848" }
marker_cut      = { fg = "#C04030", bg = "#C04030" }
marker_marked   = { fg = "#B03060", bg = "#B03060" }
marker_selected = { fg = "#B86A2A", bg = "#B86A2A" }

count_copied   = { fg = "#F8F6FF", bg = "#246644" }
count_cut      = { fg = "#F8F6FF", bg = "#AA3825" }
count_selected = { fg = "#F8F6FF", bg = "#B86A2A" }

border_symbol = "│"
border_style  = { fg = "#696980" }

[tabs]
active   = { fg = "#1A1A2E", bold = true }
inactive = { fg = "#696980" }

[indicator]
current = { fg = "#F8F6FF", bg = "#7A5010" }
parent  = { fg = "#F8F6FF", bg = "#BBB6D5" }
preview = { underline = true }

[mode]
normal_main = { fg = "#F8F6FF", bg = "#4A4098",  bold = true }
normal_alt  = { fg = "#4A4098",  bg = "#D5D1E8" }
select_main = { fg = "#F8F6FF", bg = "#246644", bold = true }
select_alt  = { fg = "#246644", bg = "#D5D1E8" }
unset_main  = { fg = "#F8F6FF", bg = "#AA3825",   bold = true }
unset_alt   = { fg = "#AA3825",   bg = "#D5D1E8" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#696980" }

progress_label  = { bold = true }
progress_normal = { fg = "#4A4098", bg = "#F8F6FF" }
progress_error  = { fg = "#AA3825",  bg = "#F8F6FF" }

permissions_t = { fg = "#246644" }
permissions_r = { fg = "#7A5010" }
permissions_w = { fg = "#AA3825" }
permissions_x = { fg = "#962848" }
permissions_s = { fg = "#696980" }
perm_type     = { fg = "#4A4A62" }
perm_sep      = { fg = "#88889E" }

[spot]
tbl_col  = { fg = "#B86A2A", bold = true }
tbl_cell = { fg = "#1A1A2E" }

[notify]
title_info  = { fg = "#4A4098" }
title_warn  = { fg = "#7A5010" }
title_error = { fg = "#AA3825" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

[confirm]
title   = { fg = "#B86A2A", bold = true }
content = { fg = "#1A1A2E" }
list    = { fg = "#4A4A62" }
btn_yes = { fg = "#F8F6FF", bg = "#246644", bold = true }
btn_no  = { fg = "#F8F6FF", bg = "#AA3825",   bold = true }

[input]
border   = { fg = "#B86A2A" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#B86A2A" }
active   = { fg = "#802870", bold = true }
inactive = {}

[completion]
border   = { fg = "#B86A2A" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#B86A2A" }
title   = {}
hovered = { fg = "#802870", underline = true }

[which]
mask            = { bg = "#F8F6FF" }
cand            = { fg = "#962848" }
rest            = { fg = "#696980" }
desc            = { fg = "#802870" }
separator       = "  "
separator_style = { fg = "#696980" }

[help]
on      = { fg = "#962848" }
run     = { fg = "#802870" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#F8F6FF", bg = "#4A4A62" }

[filetype]
rules = [
	{ mime = "image/*",                                        fg = "#962848" },
	{ mime = "{audio,video}/*",                                fg = "#7A5010" },
	{ mime = "application/*zip*",                              fg = "#802870" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#802870" },
	{ mime = "application/{pdf,doc,rtf}",                      fg = "#246644" },
	{ mime = "text/*",                                         fg = "#4A4A62" },
	{ mime = "inode/directory",                                fg = "#1A1A2E" },
	{ url = "*", fg = "#4A4A62" },
]
